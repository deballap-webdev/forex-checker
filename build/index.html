<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <title>Foreign Exchange Checker</title>
  </head>
  <body class="bg-BGCOLOR text-TEXT-COLOR font-FF">
    <header>
      <div class="flex flex-row items-center justify-between px-6 py-5">
        <img src="img/logo.svg" alt="" />
        <div class="text-FADED text-[10px] md:text-[14px]">
          55 CURRENCIES • EOD • ECB DATA
        </div>
      </div>
      <div class="bg-DARK relative flex">
        <div

        >
          <span class="mr-2">•</span>LIVE MARKETS
        </div>
        <div class="ticker-item">
          <span class="text-FADED">GBP/USD</span>
          <strong>1.3575</strong>
          <span class="text-RED whitespace-nowrap"> ▼ -0.22% </span>
        </div>
        <div class="ticker-item">
          <span class="text-FADED">USD/JPY</span>
          <strong>1.57.91</strong>
          <span class="text-GREEN whitespace-nowrap"> ▲ +0.08% </span>
        </div>
        <div class="ticker-item">
          <span class="text-FADED">USD/CHF</span>
          <strong>1.7895</strong>

        </div>

          <strong>1.3575</strong>

        <div class="ticker-item">
          <span class="text-FADED">USD/CHF</span>
          <strong>1.7895</strong>
          <span class="text-RED whitespace-nowrap"> ▼ -1.22% </span>
        </div>
        <div class="ticker-item">

          <strong>1.3575</strong>
          <span class="text-RED whitespace-nowrap"> ▼ -0.22% </span>

          <strong>1.7895</strong>
